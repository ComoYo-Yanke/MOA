<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOA</title>
    <style>
        /* 整个滚动条 */
        ::-webkit-scrollbar {
            width: 5px;
        }

        /* 滚动条轨道 */
        ::-webkit-scrollbar-track {
            background: #CDCDDF;
        }

        /* 滚动条滑块 */
        ::-webkit-scrollbar-thumb {
            background: #0092fa;
            border-radius: 7px;
        }

        /* 鼠标悬停 */
        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
        
    </style>

    
</head>

<body">
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
</body>

</html>
